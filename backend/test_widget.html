<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Test AgentHub Widget</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 40px;
            background: linear-gradient(135deg, #fdfdfd 0%, #ffffff 100%);
            color: white;
            min-height: 100vh;
        }

        h1 {
            font-size: 2.5em;
            margin-bottom: 20px;
        }

        p {
            font-size: 1.2em;
            line-height: 1.6;
        }


        .agenthub-chat-widget {
            position: fixed;
            bottom: 20px;
            right: 20px;
            width: 400px;
            height: 600px;
            border: none;
            border-radius: 12px;
            box-shadow: 0 4px 20px rgba(0, 0, 0, 0.15);
            z-index: 9999;
        }
    </style>
</head>

<body>

    <!-- PASTE YOUR EMBED CODE HERE -->
    <!-- AgentHub Chatbot Widget -->
    <!-- AgentHub Chatbot Widget -->
    <script>
        (function () {
            var chatWidget = document.createElement('iframe');
            chatWidget.id = 'agenthub-chat-widget';
            chatWidget.className = 'agenthub-chat-widget';
            chatWidget.src = 'http://localhost:8000/widget/wk_5EcDPUz6yDOapawv08CfQ9W2fcjYBH5E?tenant_id=3105b788-b5ff-4d56-88a9-532af4ab4ded';
            document.body.appendChild(chatWidget);

            // Message handler for widget-parent communication
            window.addEventListener('message', function (e) {
                if (e.data.type === 'agenthub:minimize') {
                    chatWidget.style.height = '80px';
                    chatWidget.style.width = '80px';
                    chatWidget.style.borderRadius = '50%';
                } else if (e.data.type === 'agenthub:maximize') {
                    chatWidget.style.height = '';
                    chatWidget.style.width = '';
                    chatWidget.style.borderRadius = '';
                }
            });
        })();
    </script>
</body>

</html>
