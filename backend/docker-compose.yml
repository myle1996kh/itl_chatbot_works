version: "3.9"

services:
  redis:
    image: redis:7-alpine
    container_name: itl_redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports:
      - "${REDIS_PORT:-6379}:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - redis_data:/data

  backend:
    build:
      context: ..
      dockerfile: backend/Dockerfile
    container_name: itl_backend
    restart: unless-stopped
    env_file:
      - .env.docker
    environment:
      # Use Redis container inside Docker network
      REDIS_URL: ${REDIS_URL:-redis://redis:6379}
    depends_on:
      redis:
        condition: service_healthy
    ports:
      - "${API_PORT:-8000}:8000"

volumes:
  redis_data:
