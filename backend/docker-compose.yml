version: '3.8'

services:
  # PostgreSQL 15 with pgvector extension
  postgres:
    image: pgvector/pgvector:pg15
    container_name: agenthub-postgres
    environment:
      POSTGRES_DB: ${DB_NAME:-chatbot_itl}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-postgres}
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
    ports:
      - "${DB_PORT:-5432}:5432"
    volumes:
      # Persist database data
      - postgres_data:/var/lib/postgresql/data
      # Initialize pgvector extension on first run
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres} -d ${DB_NAME:-chatbot_itl}"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped
    networks:
      - agenthub-network

  # Redis 7 for caching
  redis:
    image: redis:7-alpine
    container_name: agenthub-redis
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    ports:
      - "${REDIS_PORT:-6379}:6379"
    volumes:
      # Persist Redis data
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 5
    restart: unless-stopped
    networks:
      - agenthub-network

  # Optional: pgAdmin for database management
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: agenthub-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@agenthub.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - agenthub-network
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

  # Optional: Redis Commander for Redis management
  redis-commander:
    image: rediscommander/redis-commander:latest
    container_name: agenthub-redis-commander
    environment:
      REDIS_HOSTS: local:redis:6379
    ports:
      - "${REDIS_COMMANDER_PORT:-8081}:8081"
    depends_on:
      - redis
    restart: unless-stopped
    networks:
      - agenthub-network
    profiles:
      - admin  # Only start with: docker-compose --profile admin up

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local
  pgadmin_data:
    driver: local

networks:
  agenthub-network:
    driver: bridge

# Usage:
# ------
#
# 1. Start core services (PostgreSQL + Redis):
#    docker-compose up -d
#
# 2. Start with admin tools (pgAdmin + Redis Commander):
#    docker-compose --profile admin up -d
#
# 3. Stop all services:
#    docker-compose down
#
# 4. Stop and remove volumes (WARNING: deletes all data):
#    docker-compose down -v
#
# 5. View logs:
#    docker-compose logs -f
#    docker-compose logs -f postgres
#    docker-compose logs -f redis
#
# 6. Check service status:
#    docker-compose ps
#
# Environment Variables (set in .env file):
# -------------------------------------------
# DB_NAME=chatbot_itl              # Database name
# DB_USER=postgres                 # Database user
# DB_PASSWORD=your_secure_password # Database password (CHANGE THIS!)
# DB_PORT=5432                     # PostgreSQL port
# REDIS_PORT=6379                  # Redis port
# PGADMIN_EMAIL=admin@example.com  # pgAdmin login email
# PGADMIN_PASSWORD=admin           # pgAdmin password
# PGADMIN_PORT=5050                # pgAdmin web UI port
# REDIS_COMMANDER_PORT=8081        # Redis Commander port
#
# Access URLs (when running):
# ---------------------------
# PostgreSQL: localhost:5432
# Redis: localhost:6379
# pgAdmin: http://localhost:5050 (with --profile admin)
# Redis Commander: http://localhost:8081 (with --profile admin)
#
# Database Connection String:
# ---------------------------
# postgresql://${DB_USER}:${DB_PASSWORD}@localhost:${DB_PORT}/${DB_NAME}
#
# Example:
# postgresql://postgres:your_secure_password@localhost:5432/chatbot_itl
