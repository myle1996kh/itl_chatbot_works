# ITL_PGVector Database Initialization Configuration
# This file defines all settings for initializing a fresh database

# Database Configuration
database:
  # Override these for different environments
  # Default: PostgreSQL on localhost:5432
  url: "postgresql://postgres:123456@localhost:5432/chatbot_itl"
  # Alternative formats:
  # url: "postgresql://user:password@host:port/database"
  pool_size: 20
  max_overflow: 10

# Demo Tenant Configuration
demo_tenants:
  - enabled: true  # Set to false to skip demo tenant creation
    tenant_info:
      name: "eTMS"
      domain: "etms.agenthub.local"
      status: "active"
    llm_config:
      provider: "openrouter"
      model_id: "gpt-4o-mini"  # Reference to model created in base seeding
      api_key: "${OPENROUTER_API_KEY}"  # Will read from environment variable
    widget_config:
      theme: "light"
      primary_color: "#3B82F6"
      secondary_color: "#10B981"
      welcome_message: "Welcome to our Demo Assistant!"
      placeholder: "Ask me anything about our products..."
    enabled_agents:
      - "AgentGuidance"    # Agent with RAG tool
    enabled_tools:
      - "knowledge_base_search"  # RAG tool
  - enabled: true
    tenant_info:
      name: "Google Tenant"
      domain: "google.agenthub.local"
      status: "active"
    llm_config:
      provider: "google"
      model_id: "gemini-1.5-flash-google"
      api_key: "AIzaSyDhsD6edS4hdMq641a1Wx9aGYUHMYZfDuc"
    widget_config:
      theme: "dark"
      primary_color: "#4285F4"
      secondary_color: "#34A853"
      welcome_message: "Welcome! How can I help you today?"
      placeholder: "Ask a question..."
    enabled_agents:
      - "AgentGuidance"
    enabled_tools:
      - "knowledge_base_search"

# RAG Configuration for Demo Tenant
rag:
  enabled: true
  documents:
    - path: "backend/eTMS.docx"
      name: "eTMS Document"
      description: "eTMS complete user guide from DOCX file"
  chunk_size: 600
  chunk_overlap: 100

# Base Data (LLM Models, Tools, Formats, Agents)
# These are created once and shared across all tenants
base_data:

  # LLM Models
  llm_models:
    - id: "gemini-1.5-flash-google"
      name: "Gemini 1.5 Flash (Google)"
      provider: "google"
      base_url: "https://generativelanguage.googleapis.com/v1beta"
      model_name: "models/gemini-1.5-flash-latest"
      context_window: 1000000
      is_active: true
    - id: "gpt-4o-mini"
      name: "GPT-4o Mini"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      model_name: "openai/gpt-4o-mini"
      context_window: 128000
      is_active: true
    - id: "gpt-4o"
      name: "GPT-4o"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      model_name: "openai/gpt-4o"
      context_window: 128000
      is_active: true
    - id: "claude-3.5-sonnet"
      name: "Claude 3.5 Sonnet"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      model_name: "anthropic/claude-3.5-sonnet"
      context_window: 200000
      is_active: true
    - id: "gemini-1.5-pro"
      name: "Gemini 1.5 Pro"
      provider: "openrouter"
      base_url: "https://openrouter.ai/api/v1"
      model_name: "google/gemini-1.5-pro"
      context_window: 1000000
      is_active: true
    - id: "gpt-4o-mini-openai"
      name: "GPT-4o Mini (OpenAI)"
      provider: "openai"
      base_url: "https://api.openai.com/v1"
      model_name: "gpt-4o-mini"
      context_window: 128000
      is_active: true

  # Base Tools (tool types - templates)
  base_tools:
    - id: "rag"
      name: "RAG Knowledge Base Search"
      description: "Search tenant's knowledge base using semantic similarity"
      handler_class: "tools.rag.RAGTool"
      input_schema:
        type: "object"
        properties:
          query:
            type: "string"
            description: "Search query"
          top_k:
            type: "integer"
            description: "Number of results (1-20)"
            minimum: 1
            maximum: 20
        required: ["query"]
      is_active: true
    # ... other base tools ...

  # Tool Configurations (specific instances of base tools)
  tool_configs:
    - id: "knowledge_base_search"
      name: "knowledge_base_search"
      base_tool_id: "rag"
      config:
        top_k: 3
        chunk_size: 600
        chunk_overlap: 100
        embedding_model: "all-MiniLM-L6-v2"
        embedding_dimension: 384
        distance_strategy: "COSINE"
      is_active: true

  # Output Formats
  output_formats:
    - id: "json"
      name: "JSON"
      description: "Structured JSON format"
      content_type: "application/json"
    # ... other formats ...

  # Agent Configurations
  agents:
    - id: "agent_guidance"
      name: "AgentGuidance"
      description: "eTMS Guidance Assistant - Hỗ trợ người dùng với quy trình và chỉ dẫn"
      llm_model_id: "gpt-4o-mini"  # Use OpenRouter model
      handler_class: "agents.guidance.AgentGuidance"
      prompt_template: |
        Bạn là một asistant hỗ trợ chuyên về hệ thống eTMS (Freightos Transportation Management System).
        Hướng dẫn người dùng với các quy trình, chỉ dẫn chi tiết dựa trên kiến thức về eTMS từ knowledge base.
        Luôn trích dẫn nguồn từ knowledge base khi cung cấp thông tin.
        Nếu không có thông tin trong knowledge base, rõ ràng nêu rằng cần kiểm tra thêm từ nguồn khác.
        Luôn sử dụng tiếng Việt. Chuyên nghiệp, rõ ràng, chi tiết và đầy đủ.
      tools:
        - "knowledge_base_search"  # This agent uses the RAG tool
      output_format: "markdown"
      is_active: true
    # ... other agents ...

# Logging Configuration
logging:
  level: "INFO"
  format: "json"
  output: "console"

# Advanced Options
advanced:
  idempotent: true
  force_reset: false
  validate: true
  verbose: false