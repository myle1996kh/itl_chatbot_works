# Critical Dependencies
dependencies:
  - phase_0 must complete before phase_1 starts (new models needed)
  - backend_models must complete before frontend chat works
  - login endpoint must complete before admin dashboard works
  - escalation endpoints must complete before frontend escalation UI

# Blockers & Risks
blockers: []

risks:
  - Agent ID mapping mismatch between frontend config and backend agents
    mitigation: "Document in TOPIC_TO_AGENT_MAPPING.md, validate in tests"
  - Supporter availability during escalation
    mitigation: "Queue escalations, show estimated wait time"
  - Performance with concurrent escalations
    mitigation: "Load test before release"

# Documentation Reference
docs:
  - "FRONTEND_INTEGRATION_PLAN.md" - Full roadmap & timeline
  - "USER_MANAGEMENT_SPEC.md" - Database schemas, auth, user endpoints
  - "TOPIC_TO_AGENT_MAPPING.md" - Agent routing architecture
