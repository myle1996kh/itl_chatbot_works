# How to Use This File
instructions: |
  1. Update "status" fields as work progresses
  2. Update "completion_percent" at end of each day
  3. Update "start_date" / "end_date" when phase begins/ends
  4. Record blockers if any task is stuck
  5. Weekly: Review milestones and adjust timeline if needed

