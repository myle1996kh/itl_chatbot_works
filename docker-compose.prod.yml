version: '3.8'

services:
  app:
    build:
      context: .
      dockerfile: Dockerfile.prod
    ports:
      - "8000:8000"
    env_file:
      - ./backend/.env
    environment:
      - DATABASE_URL=${DATABASE_URL:-postgresql://postgres:Postgres123!@host.docker.internal:32001/chatbot}
      - REDIS_URL=${REDIS_URL:-redis://redis:6379}
      - FERNET_KEY=${FERNET_KEY}
      - JWT_PUBLIC_KEY=${JWT_PUBLIC_KEY}
      - DISABLE_AUTH=${DISABLE_AUTH:-false}
      - ENVIRONMENT=${ENVIRONMENT:-production}
      - LOG_LEVEL=${LOG_LEVEL:-info}
      - API_HOST=${API_HOST:-0.0.0.0}
      - API_PORT=${API_PORT:-8000}
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}
      - DB_POOL_SIZE=${DB_POOL_SIZE:-20}
      - DB_MAX_OVERFLOW=${DB_MAX_OVERFLOW:-10}
      - CACHE_TTL_SECONDS=${CACHE_TTL_SECONDS:-3600}
      - DEFAULT_RATE_LIMIT_RPM=${DEFAULT_RATE_LIMIT_RPM:-60}
      - DEFAULT_RATE_LIMIT_TPM=${DEFAULT_RATE_LIMIT_TPM:-10000}
      - OPENROUTER_API_KEY=${OPENROUTER_API_KEY}
      - OPENROUTER_BASE_URL=${OPENROUTER_BASE_URL:-https://openrouter.ai/api/v1}
      - OPENAI_API_KEY=${OPENAI_API_KEY}
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY}
      - GOOGLE_API_KEY=${GOOGLE_API_KEY}
      - TEST_BEARER_TOKEN=${TEST_BEARER_TOKEN}
    volumes:
      - ./uploads:/app/uploads
      - ./logs:/app/logs
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 60s

  # db:
  #   image: ankane/pgvector:v0.5.1
  #   env_file:
  #     - ./backend/.env
  #   environment:
  #     - POSTGRES_DB=${POSTGRES_DB:-chatbot_db}
  #     - POSTGRES_USER=${POSTGRES_USER:-user}
  #     - POSTGRES_PASSWORD=${POSTGRES_PASSWORD:-password}
  #   volumes:
  #     - postgres_data:/var/lib/postgresql/data
  #     - ./backend/init-db.sql:/docker-entrypoint-initdb.d/init.sql
  #   ports:
  #     - "32001:32001"
  #   healthcheck:
  #     test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-user} -d ${POSTGRES_DB:-chatbot_db}"]
  #     interval: 10s
  #     timeout: 5s
  #     retries: 5
  #   restart: unless-stopped

  redis:
    image: redis:7-alpine
    env_file:
      - .env
    ports:
      - "6379:6379"
    volumes:
      - redis_data:/data
    command: redis-server --appendonly yes --requirepass ${REDIS_PASSWORD:-}
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  nginx:
    image: nginx:alpine
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
      - ./ssl:/etc/nginx/ssl:ro
    depends_on:
      - app
    restart: unless-stopped
    environment:
      - CORS_ORIGINS=${CORS_ORIGINS:-http://localhost:3000,http://localhost:8080}

volumes:
  # postgres_data:
  redis_data: