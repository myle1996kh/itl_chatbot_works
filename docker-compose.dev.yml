version: '3.8'

services:
  # ============================================================================
  # PostgreSQL Database with pgvector extension
  # ============================================================================
  postgres:
    image: pgvector/pgvector:pg15
    container_name: itl_chatbot_postgres_dev
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${DB_NAME:-chatbot}
      POSTGRES_USER: ${DB_USER:-postgres}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-Postgres123!}
      POSTGRES_INITDB_ARGS: "-E UTF8"
      # Performance tuning
      POSTGRES_SHARED_BUFFERS: 256MB
      POSTGRES_EFFECTIVE_CACHE_SIZE: 1GB
      POSTGRES_WORK_MEM: 16MB
    volumes:
      - postgres_data_dev:/var/lib/postgresql/data
      # Initialize pgvector extension
      - ./init-db.sql:/docker-entrypoint-initdb.d/init-db.sql
    ports:
      - "${DB_PORT:-32001}:32001"
    networks:
      - itl_network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${DB_USER:-postgres}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Redis Cache
  # ============================================================================
  redis:
    image: redis:7-alpine
    container_name: itl_chatbot_redis_dev
    restart: unless-stopped
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru ${REDIS_PASSWORD:+--requirepass $REDIS_PASSWORD}
    volumes:
      - redis_data_dev:/data
    ports:
      - "${REDIS_PORT:-6379}:6379"
    networks:
      - itl_network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ============================================================================
  # Backend Application (Development)
  # ============================================================================
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: itl_chatbot_backend_dev
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    environment:
      # Database
      DATABASE_URL: postgresql://${DB_USER:-postgres}:${DB_PASSWORD:-Postgres123!}@172.23.178.103:32001/${DB_NAME:-chatbot}
      DB_POOL_SIZE: ${DB_POOL_SIZE:-20}
      DB_MAX_OVERFLOW: ${DB_MAX_OVERFLOW:-10}

      # Redis
      REDIS_URL: redis://${REDIS_PASSWORD:+:$REDIS_PASSWORD@}redis:6379
      CACHE_TTL_SECONDS: ${CACHE_TTL_SECONDS:-3600}

      # Security
      FERNET_KEY: ${FERNET_KEY}
      JWT_PUBLIC_KEY: ${JWT_PUBLIC_KEY}
      DISABLE_AUTH: ${DISABLE_AUTH:-true}  # Enable dev auth

      # Application
      ENVIRONMENT: development
      LOG_LEVEL: DEBUG
      API_HOST: 0.0.0.0
      API_PORT: 8000

      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:3000,http://localhost:3000}

      # Rate Limiting
      DEFAULT_RATE_LIMIT_RPM: ${DEFAULT_RATE_LIMIT_RPM:-60}
      DEFAULT_RATE_LIMIT_TPM: ${DEFAULT_RATE_LIMIT_TPM:-10000}

      # LLM Providers (optional)
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GOOGLE_API_KEY: ${GOOGLE_API_KEY:-}
      OPENROUTER_API_KEY: ${OPENROUTER_API_KEY:-}
      PROTONX_API_KEY: ${PROTONX_API_KEY:-}

    volumes:
      # Mount backend source for hot-reload
      - ./backend/src:/app/src
      - ./backend/pyproject.toml:/app/pyproject.toml
      # Mount JWT private key (read-only)
      - ./jwt_private.pem:/app/jwt_private.pem:ro
      # Mount .env file for runtime access
      - ./backend/.env:/app/.env:ro
      # Optional: Mount uploads directory
      - uploads_data_dev:/app/uploads

    ports:
      - "${API_PORT:-8000}:8000"

    networks:
      - itl_network

    healthcheck:
      test: ["CMD", "python", "-c", "import requests; requests.get('http://localhost:8000/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      start_period: 40s
      retries: 3

  # ============================================================================
  # Frontend Application (Development)
  # ============================================================================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile.dev  # You would need to create this
    container_name: itl_chatbot_frontend_dev
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules  # Don't mount node_modules to avoid conflicts
    ports:
      - "3000:3000"  # Vite default port
    environment:
      - NODE_ENV=development
    networks:
      - itl_network
    depends_on:
      - backend
    stdin_open: true
    tty: true

  # ============================================================================
  # Optional: pgAdmin for database management
  # ============================================================================
  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: itl_chatbot_pgadmin_dev
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-admin@itl.local}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-admin}
      PGADMIN_CONFIG_SERVER_MODE: 'False'
    ports:
      - "${PGADMIN_PORT:-5050}:80"
    volumes:
      - pgadmin_data_dev:/var/lib/pgadmin
    depends_on:
      - postgres
    restart: unless-stopped
    networks:
      - itl_network
    profiles:
      - admin

# ============================================================================
# Networks
# ============================================================================
networks:
  itl_network:
    driver: bridge

# ============================================================================
# Volumes
# ============================================================================
volumes:
  postgres_data_dev:
    driver: local
  redis_data_dev:
    driver: local
  uploads_data_dev:
    driver: local
  pgadmin_data_dev:
    driver: local